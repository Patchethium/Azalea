name: frontend

on:
  push:
    paths:
      - ".github/workflows/frontend.yml"
      - "src/**"
      - "biome.json"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "uno.config.ts"
      - "vite.config.ts"
      - "vitest.config.ts"
  pull_request:
    paths:
      - ".github/workflows/frontend.yml"
      - "src/**"
      - "biome.json"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "uno.config.ts"
      - "vite.config.ts"
      - "vitest.config.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        run: pnpm check

      - name: Build frontend
        run: pnpm build

      - name: Run frontend tests
        run: pnpm test:run
