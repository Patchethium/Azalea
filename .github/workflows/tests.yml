name: packaged smoke

on:
  push:
    paths:
      - ".cargo/**"
      - ".github/workflows/tests.yml"
      - "e2e/**"
      - "patches/**"
      - "src/**"
      - "src-tauri/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "uno.config.ts"
      - "vite.config.ts"
      - "wdio.conf.ts"
  pull_request:
    paths:
      - ".cargo/**"
      - ".github/workflows/tests.yml"
      - "e2e/**"
      - "patches/**"
      - "src/**"
      - "src-tauri/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "uno.config.ts"
      - "vite.config.ts"
      - "wdio.conf.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaged-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-packaged-smoke:
    name: Build packaged smoke application
    if: ${{ false }} # Temporarily disabled; remove this line to re-enable.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang mold libasound2-dev libwebkit2gtk-4.1-dev

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Build packaged smoke application
        run: pnpm test:e2e:build

      - name: Upload packaged smoke application
        uses: actions/upload-artifact@v7
        with:
          name: azalea-e2e-linux-x64
          path: src-tauri/target/debug/azalea
          if-no-files-found: error
          retention-days: 1

  packaged-smoke:
    name: Packaged smoke
    needs: build-packaged-smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux runtime and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev libwebkit2gtk-4.1-dev xauth xvfb

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Download packaged smoke application
        uses: actions/download-artifact@v7
        with:
          name: azalea-e2e-linux-x64
          path: src-tauri/target/debug

      - name: Verify packaged smoke application
        run: |
          chmod +x src-tauri/target/debug/azalea
          test -x src-tauri/target/debug/azalea

      - name: Run packaged smoke test
        run: xvfb-run --auto-servernum pnpm test:e2e:run
