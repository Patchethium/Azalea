name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install --global pnpm@10.4.1

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        run: pnpm check

      - name: Build frontend
        run: pnpm build

      - name: Run frontend tests
        run: pnpm test:run

  rust:
    name: Rust
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang mold libasound2-dev libwebkit2gtk-4.1-dev

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Restore VOICEVOX test assets
        id: voicevox_assets
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/voicevox-core
          key: voicevox-core-linux-x64-voicevox-ort-1.17.3-open-jtalk-1.11.1-vvm-0.16.4-0

      - name: Download VOICEVOX test assets
        if: steps.voicevox_assets.outputs.cache-hit != 'true'
        env:
          AZALEA_TEST_CORE_DIR: ${{ runner.temp }}/voicevox-core
        run: |
          set -euo pipefail

          mkdir -p \
            "$AZALEA_TEST_CORE_DIR/onnxruntime" \
            "$AZALEA_TEST_CORE_DIR/dict" \
            "$AZALEA_TEST_CORE_DIR/models"

          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/onnxruntime.tgz" \
            https://github.com/VOICEVOX/onnxruntime-builder/releases/download/voicevox_onnxruntime-1.17.3/voicevox_onnxruntime-linux-x64-1.17.3.tgz
          tar --extract --gzip \
            --file "$RUNNER_TEMP/onnxruntime.tgz" \
            --directory "$AZALEA_TEST_CORE_DIR/onnxruntime" \
            --strip-components 1
          echo "2ebafae642d0b62efe8562d1ee6037ff6a29e8f6e996b4a444bfd777d8c0c3ba  $AZALEA_TEST_CORE_DIR/onnxruntime/lib/libvoicevox_onnxruntime.so.1.17.3" \
            | sha256sum --check

          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/open_jtalk_dic.tar.gz" \
            https://github.com/r9y9/open_jtalk/releases/download/v1.11.1/open_jtalk_dic_utf_8-1.11.tar.gz
          echo "fe6ba0e43542cef98339abdffd903e062008ea170b04e7e2a35da805902f382a  $RUNNER_TEMP/open_jtalk_dic.tar.gz" \
            | sha256sum --check
          tar --extract --gzip \
            --file "$RUNNER_TEMP/open_jtalk_dic.tar.gz" \
            --directory "$AZALEA_TEST_CORE_DIR/dict"

          curl --fail --location --retry 3 \
            --output "$AZALEA_TEST_CORE_DIR/models/0.vvm" \
            https://github.com/VOICEVOX/voicevox_vvm/releases/download/0.16.4/0.vvm
          echo "917e592cae92a02fb7668bd9e168df4e39c8ab2f5302c2be71906c70ec4e2df2  $AZALEA_TEST_CORE_DIR/models/0.vvm" \
            | sha256sum --check

      - name: Run all Rust tests
        working-directory: src-tauri
        env:
          AZALEA_TEST_CORE_DIR: ${{ runner.temp }}/voicevox-core
        run: cargo test --locked -- --test-threads=1

      - name: Verify generated TypeScript bindings
        run: git diff --exit-code -- src/binding.ts

  packaged-smoke:
    name: Packaged smoke
    needs:
      - frontend
      - rust
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang mold libasound2-dev libwebkit2gtk-4.1-dev xauth xvfb

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install --global pnpm@10.4.1

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Build and run packaged smoke test
        run: xvfb-run --auto-servernum pnpm test:e2e
