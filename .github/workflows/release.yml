name: 'publish'

on:
  workflow_dispatch:

jobs:
  tests:
    name: Test before packaging
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  publish-tauri:
    needs: tests
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
          # - platform: 'macos-latest' # for Intel based macs.
          #   args: '--target x86_64-apple-darwin'
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04' # for Linux
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.28.6

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-28
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: setup mold on Linux
        if: matrix.platform == 'ubuntu-22.04'
        uses: rui314/setup-mold@v1
        with:
          mold-version: 1.1.1
          make-default: false

      - name: install frontend dependencies
        run: pnpm i

      # The prebuilt download can hang on GitHub release outages; build from
      # source when it does not finish in time.
      - name: install cargo-about
        id: cargo_about
        continue-on-error: true
        timeout-minutes: 2
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
          fallback: none

      - name: build cargo-about from source
        if: steps.cargo_about.outcome != 'success'
        run: cargo install cargo-about --locked --version 0.9.2 --features cli

      - uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version.
          releaseName: 'Azalea v__VERSION__'
          releaseBody: |
            See the assets to download this version and install.

            **Windows:** Azalea needs the [Microsoft Visual C++ Redistributable](https://aka.ms/vs/17/release/vc_redist.x64.exe). Install it if Azalea reports that `MSVCP140.dll` or `VCRUNTIME140.dll` is missing.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
