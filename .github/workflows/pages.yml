name: Landing page

on:
  push:
    branches: [master, feature/landing-page]
    paths:
      - apps/landing/**
      - packages/theme/**
      - icon/azalea.png
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.json
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - apps/landing/**
      - packages/theme/**
      - icon/azalea.png
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install shared workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Check landing page and shared theme
        run: pnpm check:landing
      - name: Test tuning preview interactions
        run: pnpm test:landing
      - name: Build landing page
        run: pnpm build:landing
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/landing/dist

  deploy:
    # Pull requests and feature branches validate the site without publishing it.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
