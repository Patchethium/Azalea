name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
        description: Build artifacts but skip publishing the GitHub Release

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: build-release
  cancel-in-progress: true

jobs:
  # ── Linux ────────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: >-
            libwebkit2gtk-4.1-dev libxdo-dev
            libayatana-appindicator3-dev librsvg2-dev
            imagemagick mold clang
          version: 1.0

      - uses: dtolnay/rust-toolchain@stable

      # Cache ~/.cargo/bin (tauri-cli binary) separately so we can skip the
      # binstall step on cache hits. Key includes "tauri2" — bump to bust cache
      # when upgrading tauri-cli major version.
      - name: Cache cargo bin
        id: cargo-bin-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: cargo-bin-linux-tauri2

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install cargo-binstall
        if: steps.cargo-bin-cache.outputs.cache-hit != 'true'
        uses: cargo-bins/cargo-binstall@main

      - name: Install tauri-cli
        if: steps.cargo-bin-cache.outputs.cache-hit != 'true'
        run: cargo binstall tauri-cli --version "^2.0" --no-confirm --locked
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > /tmp/tauri.conf.json
          mv /tmp/tauri.conf.json src-tauri/tauri.conf.json
          sed -i.bak "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml && rm -f src-tauri/Cargo.toml.bak
          echo "Version set to $VERSION"

      - name: Build (deb + AppImage)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CARGO_PROFILE_RELEASE_LTO: thin
          # mold is installed above — use it instead of the default BFD linker.
          # clang is the driver; -fuse-ld=mold selects mold as the backend.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
          RUSTFLAGS: -C link-arg=-fuse-ld=mold
        run: cd src-tauri && cargo tauri build --bundles deb,appimage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.AppImage.tar.gz
            src-tauri/target/release/bundle/**/*.AppImage.tar.gz.sig

  # ── macOS ────────────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-apple-darwin

      - name: Cache cargo bin
        id: cargo-bin-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: cargo-bin-macos-${{ matrix.arch }}-tauri2

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-${{ matrix.arch }}
          cache-on-failure: true

      - name: Install cargo-binstall
        if: steps.cargo-bin-cache.outputs.cache-hit != 'true'
        uses: cargo-bins/cargo-binstall@main

      - name: Install tauri-cli
        if: steps.cargo-bin-cache.outputs.cache-hit != 'true'
        run: cargo binstall tauri-cli --version "^2.0" --no-confirm --locked
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > /tmp/tauri.conf.json
          mv /tmp/tauri.conf.json src-tauri/tauri.conf.json
          sed -i.bak "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml && rm -f src-tauri/Cargo.toml.bak
          echo "Version set to $VERSION"

      - name: Build (dmg)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CARGO_PROFILE_RELEASE_LTO: thin
        run: |
          cd src-tauri
          cargo tauri build --bundles dmg --target ${{ matrix.arch }}-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-artifacts
          path: |
            src-tauri/target/${{ matrix.arch }}-apple-darwin/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.arch }}-apple-darwin/release/bundle/**/*.dmg.sig

  # ── Windows ──────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo bin
        id: cargo-bin-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: cargo-bin-windows-tauri2

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install cargo-binstall
        if: steps.cargo-bin-cache.outputs.cache-hit != 'true'
        uses: cargo-bins/cargo-binstall@main

      - name: Install tauri-cli
        if: steps.cargo-bin-cache.outputs.cache-hit != 'true'
        run: cargo binstall tauri-cli --version "^2.0" --no-confirm --locked
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > /tmp/tauri.conf.json
          mv /tmp/tauri.conf.json src-tauri/tauri.conf.json
          echo "Version set to $VERSION"

      - name: Build (nsis installer)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CARGO_PROFILE_RELEASE_LTO: thin
          # lld-link is bundled with Rust's MSVC toolchain — faster than
          # link.exe for the final link step.
          RUSTFLAGS: -C linker=lld-link
        run: cd src-tauri && cargo tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.exe.sig
            src-tauri/target/release/bundle/**/*.nsis.zip
            src-tauri/target/release/bundle/**/*.nsis.zip.sig

  # ── Publish GitHub Release ───────────────────────────────────────────────────
  publish:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') &&
      github.event.inputs.dry_run != 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate latest.json for auto-updater
        run: python3 scripts/generate-update-manifest.py > latest.json

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*
            latest.json